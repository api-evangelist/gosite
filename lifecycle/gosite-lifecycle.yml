status_page:
  published: false
  url: null
  note: >-
    SOFT-404 WARNING. https://status.gosite.com/ returns HTTP 200, but the body is
    GoSite's wildcard-subdomain catch-all reading "Website is no longer in service — if
    you are the site owner, please contact help@gosite.com". It is NOT a status page. The
    same 1,623-byte page is served by trust.gosite.com, security.gosite.com and
    developer.gosite.com (singular). Any probe that trusts the status code alone will
    credit GoSite with a status page, a trust center and a security page it does not
    operate.
