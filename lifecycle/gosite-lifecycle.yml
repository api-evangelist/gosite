generated: '2026-08-22'
method: probed
source: >-
  Live probes of GoSite's published developer, status and support surfaces, 2026-08-22,
  plus the Internet Archive record for developers.gosite.com.
note: >-
  This artifact records DECAY, which is the substantive finding for GoSite. The company
  is active and its commercial site is maintained, but the developer surface it still
  advertises has partially rotted: the Swagger reference host its own portal links to is
  returning 502, and the singular-form developer host is decommissioned. NO StatusPage
  and NO Deprecation pointer is emitted in apis.yml, because GoSite publishes neither —
  see the soft-404 warning below.
