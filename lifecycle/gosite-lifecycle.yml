surface_decay:
- host: api.developers.gosite.com
  role: >-
    The Swagger API reference host. This is the ONLY API reference link GoSite's own
    developer portal publishes ("View APIs" / step 3 of the access process).
  status: 502
  finding: >-
    nginx 502 Bad Gateway on every path probed (/, /docs/, /docs, /openapi.json,
    /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /redoc,
    /docs/openapi.json, /docs/swagger.json, /swagger/v1/swagger.json). The upstream is
    down, not merely unauthenticated. No snapshot of this host exists in the Internet
    Archive, so the reference cannot be recovered from a mirror either.
  first_observed: '2026-08-22'
- host: developer.gosite.com
  role: Singular-form developer host.
  status: 200
  finding: >-
    Serves the "Website is no longer in service" wildcard catch-all — decommissioned.
    The live developer portal is the PLURAL developers.gosite.com.
  first_observed: '2026-08-22'
- host: apps.gosite.com
  role: App store / integrations directory linked from the developer portal footer.
  status: 404
  finding: >-
    Returns GoSite's "404 Error - Page Not Found" template at the site root. The
    integrations directory the portal points at is not being served.
  first_observed: '2026-08-22'
live_surfaces:
- host: developers.gosite.com
  status: 200
  finding: >-
    Developer portal renders and is current in structure, but the page footer carries a
    "© 2022 GoSite, Inc." copyright and the API catalog still lists Sites, Placements,
    Invoices and Emails as "Coming Soon" — the same state the Internet Archive recorded
    in March 2023.
- host: api.gosite.com
  status: 401
  finding: >-
    A live, actively-served Spring application returning a current-timestamped JSON 401
    envelope. The API tier itself is running; only its public documentation is not.
