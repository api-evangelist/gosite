apis:
- aid: gosite:gosite-api
  name: GoSite API
  description: >-
    The GoSite developer API, marketed at developers.gosite.com in two families —
    Business Growth APIs (online presence, listings, lead generation) and Business
    Management APIs (scheduling, invoicing, payments). Contact Hub, GoSite's CRM
    surface, is the API listed as available and supports create, read, update and
    delete over contacts; Sites, Placements, Invoices and Emails are listed as coming
    soon. Access is approval-gated — a GoSite customer account plus an approved
    request-access form yields an API key, after which the Swagger reference at
    api.developers.gosite.com/docs/ is used. As of the 2026-08-22 probe that Swagger
    host returned HTTP 502 on every path, so no machine-readable contract could be
    retrieved.
  humanURL: https://developers.gosite.com/
  baseURL: https://api.developers.gosite.com/
