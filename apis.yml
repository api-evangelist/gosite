aid: gosite
name: GoSite
description: >-
  GoSite is a San Diego, California software company that sells an all-in-one digital
  presence and business-management platform to local service businesses — HVAC, plumbing,
  electrical, handyman, home cleaning, locksmith, moving, auto detailing, landscaping and
  pest control operators. The platform bundles a done-for-you website and domain, online
  directory and Google Business Profile listing management, review generation, a unified
  Messenger inbox, appointment booking and scheduling, contactless payments, invoicing,
  and a Contact Hub CRM, delivered through a web app and iOS/Android mobile apps. GoSite
  markets a developer program at developers.gosite.com covering "Business Growth" and
  "Business Management" APIs, with Contact Hub (CRUD over contacts) listed as the
  available surface and Sites, Placements, Invoices and Emails listed as coming soon.
  Access to the API is approval-gated: a prospective integrator must create a GoSite
  customer account, submit a request-access form, and be issued an API key before the
  Swagger reference can be used. The company has raised roughly $60M from Left Lane
  Capital and Longley Capital and remains privately held and independently operated.
